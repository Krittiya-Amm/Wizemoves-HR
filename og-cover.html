<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@500;600;700&family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--ink:#271C43;--brand:#7C3AED;--brand-dark:#5B21B6;--royal:#3D2C5F;--gold:#E2A82E}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    font-family:'IBM Plex Sans Thai','Anuphan',sans-serif;
    background:
      radial-gradient(circle at 82% 18%, rgba(226,168,46,.30), transparent 42%),
      radial-gradient(circle at 12% 88%, rgba(167,139,250,.45), transparent 46%),
      linear-gradient(135deg, #5B21B6 0%, #7C3AED 48%, #3D2C5F 100%);
    color:#fff;position:relative;
  }
  .frame{position:absolute;inset:0;padding:74px 80px;display:flex;flex-direction:column;justify-content:space-between}
  .top{display:flex;align-items:center;gap:18px}
  .logo{height:60px;width:auto;display:block;filter:drop-shadow(0 4px 16px rgba(0,0,0,.25))}
  .brand{font-weight:700;font-size:34px;letter-spacing:.2px}
  .brand small{display:block;font-family:'Anuphan',sans-serif;font-weight:500;font-size:17px;letter-spacing:3px;color:#E7DDFB;text-transform:uppercase;margin-top:2px}
  .mid{max-width:1000px}
  h1{font-weight:700;font-size:72px;line-height:1.12;letter-spacing:-.5px;text-shadow:0 6px 30px rgba(0,0,0,.22)}
  h1 .hl{color:#FCD34D}
  .sub{font-family:'Anuphan',sans-serif;font-weight:500;font-size:30px;color:#EDE6FB;margin-top:22px;line-height:1.4}
  .row{display:flex;align-items:center;justify-content:space-between;gap:24px}
  .chip{display:inline-flex;align-items:center;gap:14px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:16px 28px;backdrop-filter:blur(4px)}
  .chip b{font-size:30px;font-weight:700}
  .chip .gold{color:#FCD34D}
  .chip .dot{width:7px;height:7px;border-radius:50%;background:#EDE6FB;opacity:.7}
  .chip span{font-family:'Anuphan',sans-serif;font-weight:500;font-size:23px;color:#F2ECFC}
  .url{font-family:'Anuphan',sans-serif;font-weight:600;font-size:26px;color:#fff;opacity:.92;letter-spacing:.4px}
</style>
</head>
<body>
  <div class="frame">
    <div class="top">
      <img class="logo" src="logo.png" alt="" onerror="this.style.display='none'">
      <div class="brand" style="border-left:2px solid rgba(255,255,255,.32);padding-left:18px"><small style="margin-top:0">HR Document Templates</small></div>
    </div>
    <div class="mid">
      <h1>ชุดเอกสาร HR มาตรฐาน<br>ที่<span class="hl">นักกฎหมาย</span>ยอมรับ</h1>
      <p class="sub">ลดเวลาทำเอกสาร 80% · ป้องกันข้อพิพาทแรงงาน · อ้างอิงกฎหมายไทย</p>
    </div>
    <div class="row">
      <div class="chip"><b>เริ่มต้น <span class="gold">฿2,990</span></b><span class="dot"></span><span>โบนัส 3 ชิ้นทุกชุด</span></div>
      <div class="url">wizemoves.co</div>
    </div>
  </div>
</body>
</html>
